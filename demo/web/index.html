<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlainState Studio</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="5.5" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="14.5" cy="10" r="3" fill="currentColor" />
          <path d="M8.5 10h3" stroke="currentColor" stroke-width="2" />
        </svg>
        <h1>PlainState Studio</h1>
      </div>
      <div class="status" id="status" role="status" aria-live="polite" data-phase="synced">
        <span class="indicator" aria-hidden="true"></span>
        <span id="status-text">Deterministic</span>
        <span class="status-meta" id="status-meta"></span>
      </div>
      <div class="actions">
        <select id="example-select" aria-label="Load example">
          <option value="button-press">ButtonPress</option>
          <option value="async-fetch">AsyncFetch</option>
          <option value="door-lock">DoorLock</option>
        </select>
        <button type="button" id="format-btn">Format</button>
        <button type="button" id="reset-btn" class="quiet">Reset</button>
      </div>
    </header>

    <main class="grid">
      <section class="pane" id="pane-plain">
        <header>
          <h2>PlainState</h2>
          <span class="hint">Editable; checks determinism on every keystroke</span>
        </header>
        <div class="editor code">
          <textarea id="plain-input" spellcheck="false" aria-label="PlainState source"></textarea>
        </div>
        <footer class="notes" id="plain-notes"></footer>
      </section>

      <section class="pane" id="pane-sim">
        <header>
          <h2>Interactive Simulator</h2>
          <button type="button" id="sim-reset" class="pane-btn">Reset state</button>
        </header>
        <div class="sim-body">
          <div class="sim-block">
            <div class="sim-label">States</div>
            <div class="state-list" id="state-list"></div>
          </div>
          <div class="sim-block" id="guards-block">
            <div class="sim-label">Guards</div>
            <div class="guard-list" id="guard-list"></div>
          </div>
          <div class="sim-block">
            <div class="sim-label">Events</div>
            <div class="event-list" id="event-list"></div>
          </div>
          <div class="sim-block sim-log-block">
            <div class="sim-label">Transition log</div>
            <ol class="trace-list" id="trace-list"></ol>
          </div>
        </div>
      </section>

      <section class="pane" id="pane-formatted">
        <header>
          <h2>Formatted PlainState</h2>
          <span class="badge ok" id="compile-badge">Valid</span>
        </header>
        <div class="view reader" id="formatted-view"></div>
      </section>

      <section class="pane" id="pane-json">
        <header>
          <h2>JSON Machine</h2>
          <button type="button" id="copy-json" class="pane-btn">Copy</button>
        </header>
        <pre class="view code" id="json-view"></pre>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
